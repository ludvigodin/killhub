# Keep lint changes compatible with the Python 3.10 local gate and 3.12 runtime.
target-version = "py310"
line-length = 100
src = ["."]

[lint]
select = ["E", "F", "I", "UP", "B"]
# Prefer typing.Optional/List for FastAPI deps evaluated on older hosts.
ignore = ["UP017", "UP006", "UP007", "UP035", "UP045"]

[format]
quote-style = "double"
indent-style = "space"

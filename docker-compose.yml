# Local Plane 1 control-plane shell. Plane 2 still runs on Vultr VX1 via msb.
services:
  explore:
    build:
      context: ./explore
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env.example
    environment:
      EXPLORE_HOST: "0.0.0.0"
      EXPLORE_PORT: "8100"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-local-only}
      LEDGER_URL: sqlite:///./storage/ledger/killhub.db
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-8}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/internal/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      EXPLORE_BASE_URL: http://explore:8100
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me-local-only}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_POST_JOBS_PER_IP: ${RATE_LIMIT_POST_JOBS_PER_IP:-10}
      RATE_LIMIT_POST_JOBS_GLOBAL: ${RATE_LIMIT_POST_JOBS_GLOBAL:-60}
    depends_on:
      explore:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
